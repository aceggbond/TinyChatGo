name: Release LanChatGo for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Verify packages compile
        run: go test ./... -run '^$'

      - name: Verify current features
        shell: pwsh
        run: |
          go vet ./...
          go test ./internal/database
          go test ./internal/server -run 'TestAdministratorManagesUserCreatedGroup|TestChatClientAdminRoundTripAndHistory|TestChatIPIdentitySharesPrivateConversationAcrossTabs|TestGroupChatBroadcastImagesAndIndependentHistory' -count=1
          go test ./internal/gui -run 'TestCompareVersionNumbers|TestValidProjectURLIsRestrictedToRepository' -count=1

      - name: Build Windows GUI
        shell: pwsh
        run: |
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w" -o LanChatGo.exe .
          Compress-Archive -Path LanChatGo.exe -DestinationPath LanChatGo-windows-amd64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LanChatGo.exe LanChatGo-windows-amd64.zip --title "LanChatGo ${{ github.ref_name }}" --generate-notes
