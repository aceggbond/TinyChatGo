name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Test
        run: go test ./...

      - name: Build Windows GUI
        run: go build -buildvcs=false -ldflags "-H=windowsgui" -o HFS-Go.exe .

      - name: Create GitHub Release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" HFS-Go.exe --title "HFS Go ${{ github.ref_name }}" --generate-notes
